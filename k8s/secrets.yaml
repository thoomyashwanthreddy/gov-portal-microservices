# NOTE: Using `stringData` here for readability; Kubernetes base64-encodes it for you
# on apply. Never commit real credentials — in production, generate this from a vault
# (AWS Secrets Manager, Sealed Secrets, External Secrets Operator, etc.) instead of a
# plain file like this one.
apiVersion: v1
kind: Secret
metadata:
  name: gov-portal-secrets
  namespace: gov-portal
type: Opaque
stringData:
  POSTGRES_DB: govportal
  POSTGRES_USER: govportal
  POSTGRES_PASSWORD: change-me
  SPRING_DATASOURCE_USERNAME: govportal
  SPRING_DATASOURCE_PASSWORD: change-me
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: change-me
  KEYCLOAK_CLIENT_SECRET: ""
