apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gov-portal-ingress
  namespace: gov-portal
spec:
  ingressClassName: nginx
  rules:
    - host: gov-portal.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
