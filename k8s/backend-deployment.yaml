apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gov-portal
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Replace with your ECR image URI, pushed by the Jenkins pipeline, e.g.
          # 123456789012.dkr.ecr.us-east-1.amazonaws.com/gov-portal-backend:${BUILD_NUMBER}
          image: gov-portal-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gov-portal-config
            - secretRef:
                name: gov-portal-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gov-portal
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
